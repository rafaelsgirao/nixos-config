on: [push]
jobs:
  test:
    runs-on: native
    strategy:
      fail-fast: false
      # Here we specify the matrix of our hosts and their target platform architectures
      matrix:
        machine:
          - host: hoid
          - host: saxton
          - host: vin
    steps:
      - run: echo All good!
      - uses: actions/checkout@v4
      - run: nix config check
      - run: nix build .#nixosConfigurations.${{ matrix.machine.host }}.config.system.build.toplevel
    # Once built, we login to Attic and push the built system to our cache!
      - name: Push system
        # if: steps.build-needed.outputs.needs-build == '1'
        run: |
          attic login rgnet https://cache.rsg.ovh ${{ secrets.ATTIC_TOKEN }}
          attic push rgnet result -j 2

