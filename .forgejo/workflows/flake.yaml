on: [push]
jobs:
  test:
    runs-on: native
    steps:
      - run: echo All good!
      - uses: actions/checkout@v4
      - run: nix config check
      - run: nix build .#nixosConfigurations.adolin.config.system.build.toplevel
    # Once built, we login to Attic and push the built system to our cache!
      - name: Push system
        if: steps.build-needed.outputs.needs-build == '1'
        run: |
          nix run .#attic login rgnet https://cache.rsg.ovh ${{ secrets.ATTIC_TOKEN }}
          nix run .#attic push rgnet result -j 2

